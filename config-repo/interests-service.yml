# ══════════════════════════════════════════════════════════════════════════════
# Configuración centralizada de interests-service
# Cambios aquí se reflejan con POST /actuator/refresh (sin redeploy)
# ══════════════════════════════════════════════════════════════════════════════

core-service:
  # Eureka service id (LoadBalancer); no host/puerto fijos
  base-url: http://core-service
  connect-timeout-ms: 3000
  read-timeout-ms: 3000
  service-credential: ${CORE_SERVICE_CREDENTIAL:dev-service-credential-interests}

interests:
  annual-rate: ${INTERESTS_ANNUAL_RATE:0.035}

channel-auth:
  jwt:
    secret: ${CHANNEL_AUTH_JWT_SECRET:dev-channel-auth-jwt-signing-secret-please-rotate-in-prod}

# Resilience4j - Circuit Breaker
resilience4j:
  circuitbreaker:
    instances:
      coreServiceInterests:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      interestEventProcessing:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      coreServiceInterests:
        maxAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 2
  timelimiter:
    instances:
      coreServiceInterests:
        timeoutDuration: 5s
        cancelRunningFuture: true

# Logging level (ajustable sin redeploy)
logging:
  level:
    cl.duoc.xyzbank.interestsservice: INFO
    io.github.resilience4j: DEBUG
