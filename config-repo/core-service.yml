interests:
  kafka:
    calculated-topic: interests.calculated
    credit-results-topic: interests.credit-results
    listener-retry-interval-ms: 1000
    listener-max-retries: 3

resilience4j:
  circuitbreaker:
    instances:
      interestEventProcessing:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
