server:
  port: 8081
  ssl:
    enabled: true
    key-store: ${TLS_KEYSTORE_PATH:classpath:tls/keystore.p12}
    key-store-password: ${TLS_KEYSTORE_PASSWORD:xyzbank-dev}
    key-store-type: PKCS12
  compression:
    enabled: true

spring:
  application:
    name: bff-web
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  security:
    oauth2:
      client:
        registration:
          oidc:
            client-id: ${OIDC_CLIENT_ID:xyz-bank-web-dev}
            client-secret: ${OIDC_CLIENT_SECRET:xyz-bank-web-dev-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email
        provider:
          oidc:
            authorization-uri: ${OIDC_AUTHORIZATION_URI:http://localhost:9000/oauth2/authorize}
            token-uri: ${OIDC_TOKEN_URI:http://localhost:9000/oauth2/token}
            jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:9000/oauth2/jwks}
            user-name-attribute: sub

core-service:
  base-url: ${CORE_SERVICE_BASE_URL:http://localhost:8080}
  connect-timeout-ms: 3000
  read-timeout-ms: 3000
  service-credential: ${CORE_SERVICE_CREDENTIAL:dev-service-credential-web}

interests-service:
  base-url: ${INTERESTS_SERVICE_BASE_URL:http://localhost:8084}
  connect-timeout-ms: 3000
  read-timeout-ms: 3000

features:
  interests:
    use-interests-service: ${FEATURE_USE_INTERESTS_SERVICE:true}

channel-auth:
  jwt:
    secret: ${CHANNEL_AUTH_JWT_SECRET:dev-channel-auth-jwt-signing-secret-please-rotate-in-prod}

resilience4j:
  circuitbreaker:
    instances:
      coreServiceWeb:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      coreServiceWeb:
        maxAttempts: 3
        waitDuration: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId}] [%15.15t] %-40.40logger{39} : %m%n"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
