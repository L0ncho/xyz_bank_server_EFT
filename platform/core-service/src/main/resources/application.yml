server:
  port: 8080

spring:
  application:
    name: core-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    compatibility-verifier:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:core_service}
    username: ${DB_USERNAME:core_service}
    password: ${DB_PASSWORD:core_service}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${FEATURE_INTEREST_CREDIT_VIA_KAFKA:false}
      ack-mode: record
    consumer:
      group-id: core-service-interests
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  withdrawals:
    daily-limit: 5000.00
  events:
    transaction-confirmed:
      enabled: ${FEATURE_TRANSACTION_CONFIRMED_EVENTS:false}
      topic: transactions.confirmed
    security-alerts:
      enabled: ${FEATURE_SECURITY_ALERTS:false}
      topic: security.alerts
  outbox:
    relay-delay-ms: ${OUTBOX_RELAY_DELAY_MS:1000}

interests:
  kafka:
    enabled: ${FEATURE_INTEREST_CREDIT_VIA_KAFKA:false}
    calculated-topic: interests.calculated
    credit-results-topic: interests.credit-results
    listener-retry-interval-ms: 1000
    listener-max-retries: 3

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
    register-with-eureka: true
    fetch-registry: false
  instance:
    prefer-ip-address: true

security:
  pin-verification-tls:
    port: 8453
    keystore-path: ${TLS_PIN_KEYSTORE_PATH:classpath:tls/keystore.p12}
    keystore-password: ${TLS_PIN_KEYSTORE_PASSWORD:xyzbank-dev}
    keystore-type: PKCS12
  enforcement:
    enabled: true
  service-credentials:
    web: ${SERVICE_CREDENTIAL_WEB:dev-service-credential-web}
    mobile: ${SERVICE_CREDENTIAL_MOBILE:dev-service-credential-mobile}
    atm: ${SERVICE_CREDENTIAL_ATM:dev-service-credential-atm}
    interests: ${SERVICE_CREDENTIAL_INTERESTS:dev-service-credential-interests}
  issuer-access-token:
    jwk-set-uri: ${ISSUER_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

channel-auth:
  jwt:
    secret: ${CHANNEL_AUTH_JWT_SECRET:dev-channel-auth-jwt-signing-secret-please-rotate-in-prod}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

resilience4j:
  circuitbreaker:
    instances:
      interestEventProcessing:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{correlationId}] [%15.15t] %-40.40logger{39} : %m%n"

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
