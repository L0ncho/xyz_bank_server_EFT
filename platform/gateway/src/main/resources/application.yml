server:
  port: 8090

spring:
  application:
    name: gateway
  cloud:
    compatibility-verifier:
      enabled: false
    gateway:
      routes:
        - id: bff-web
          uri: ${BFF_WEB_BASE_URL:https://localhost:8081}
          predicates:
            - Path=/web/**
          filters:
            - StripPrefix=1
        - id: bff-mobile
          uri: ${BFF_MOBILE_BASE_URL:https://localhost:8082}
          predicates:
            - Path=/mobile/**
          filters:
            - StripPrefix=1
        - id: bff-atm
          uri: ${BFF_ATM_BASE_URL:https://localhost:8083}
          predicates:
            - Path=/atm/**
          filters:
            - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%15.15t] %-40.40logger{39} : %m%n"
