services:
  mysql:
    image: mysql:8.4
    container_name: xyz-bank-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: xyz_bank_migration
      MYSQL_USER: migration
      MYSQL_PASSWORD: migration
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - xyz_bank_mysql_data:/var/lib/mysql
      - ./data-migration/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: xyz-bank-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: core_service
      POSTGRES_USER: core_service
      POSTGRES_PASSWORD: core_service
    volumes:
      - xyz_bank_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core_service -d core_service"]
      interval: 5s
      timeout: 5s
      retries: 20

  data-migration:
    build:
      context: .
      dockerfile: data-migration/Dockerfile
    container_name: xyz-bank-data-migration
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: xyz_bank_migration
      DB_USERNAME: migration
      DB_PASSWORD: migration
      MIGRATION_RUN_ALL: "true"

  config-server:
    build:
      context: .
      dockerfile: platform/config-server/Dockerfile
    container_name: xyz-bank-config-server
    ports:
      - "8888:8888"
    volumes:
      - ./config-repo:/config-repo:ro
    environment:
      CONFIG_REPO_PATH: /config-repo
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8888/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  eureka-server:
    build:
      context: .
      dockerfile: platform/eureka-server/Dockerfile
    container_name: xyz-bank-eureka-server
    ports:
      - "8761:8761"
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8761/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  authorization-server:
    build:
      context: .
      dockerfile: platform/authorization-server/Dockerfile
    container_name: xyz-bank-authorization-server
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:9000/oauth2/jwks | grep -q keys"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  core-service:
    build:
      context: .
      dockerfile: platform/core-service/Dockerfile
    container_name: xyz-bank-core-service
    ports:
      - "8080:8080"
      - "8453:8453"
    volumes:
      - ./dev/certs/core-service/keystore.p12:/certs/keystore.p12:ro
    depends_on:
      postgres:
        condition: service_healthy
      data-migration:
        condition: service_completed_successfully
      eureka-server:
        condition: service_healthy
      authorization-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      config-server:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: core_service
      DB_USERNAME: core_service
      DB_PASSWORD: core_service
      TLS_PIN_KEYSTORE_PATH: file:/certs/keystore.p12
      TLS_PIN_KEYSTORE_PASSWORD: xyzbank-dev
      SERVICE_CREDENTIAL_WEB: dev-service-credential-web
      SERVICE_CREDENTIAL_MOBILE: dev-service-credential-mobile
      SERVICE_CREDENTIAL_ATM: dev-service-credential-atm
      SERVICE_CREDENTIAL_INTERESTS: dev-service-credential-interests
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_SERVER_URL: http://eureka-server:8761
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FEATURE_INTEREST_CREDIT_VIA_KAFKA: ${FEATURE_INTEREST_CREDIT_VIA_KAFKA:-false}
      FEATURE_TRANSACTION_CONFIRMED_EVENTS: ${FEATURE_TRANSACTION_CONFIRMED_EVENTS:-true}
      FEATURE_SECURITY_ALERTS: ${FEATURE_SECURITY_ALERTS:-true}
      ISSUER_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  kafka:
    image: apache/kafka:3.8.1
    container_name: xyz-bank-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.1
    container_name: xyz-bank-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic interests.calculated --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic interests.credit-results --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.confirmed --partitions 1 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic security.alerts --partitions 1 --replication-factor 1

  interests-service:
    build:
      context: .
      dockerfile: platform/interests-service/Dockerfile
    container_name: xyz-bank-interests-service
    ports:
      - "8084:8084"
    depends_on:
      config-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      core-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_SERVER_URL: http://eureka-server:8761
      CORE_SERVICE_CREDENTIAL: dev-service-credential-interests
      CHANNEL_AUTH_JWT_SECRET: dev-channel-auth-jwt-signing-secret-please-rotate-in-prod
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      FEATURE_INTEREST_CREDIT_VIA_KAFKA: ${FEATURE_INTEREST_CREDIT_VIA_KAFKA:-false}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8084/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  bff-web:
    build:
      context: .
      dockerfile: bff/bff-web/Dockerfile
    container_name: xyz-bank-bff-web
    ports:
      - "8081:8081"
    volumes:
      - ./dev/certs/bff-web/keystore.p12:/certs/keystore.p12:ro
    depends_on:
      core-service:
        condition: service_healthy
      interests-service:
        condition: service_healthy
      authorization-server:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_SERVER_URL: http://eureka-server:8761
      CORE_SERVICE_BASE_URL: http://core-service
      OIDC_AUTHORIZATION_URI: http://localhost:9000/oauth2/authorize
      OIDC_TOKEN_URI: http://authorization-server:9000/oauth2/token
      OIDC_JWK_SET_URI: http://authorization-server:9000/oauth2/jwks
      CORE_SERVICE_CREDENTIAL: dev-service-credential-web
      INTERESTS_SERVICE_BASE_URL: http://interests-service:8084
      FEATURE_USE_INTERESTS_SERVICE: ${FEATURE_USE_INTERESTS_SERVICE:-true}
      TLS_KEYSTORE_PATH: file:/certs/keystore.p12
      TLS_KEYSTORE_PASSWORD: xyzbank-dev
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-check-certificate -qO- https://127.0.0.1:8081/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  bff-mobile:
    build:
      context: .
      dockerfile: bff/bff-mobile/Dockerfile
    container_name: xyz-bank-bff-mobile
    ports:
      - "8082:8082"
    volumes:
      - ./dev/certs/bff-mobile/keystore.p12:/certs/keystore.p12:ro
    depends_on:
      core-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_SERVER_URL: http://eureka-server:8761
      CORE_SERVICE_BASE_URL: http://core-service
      CORE_SERVICE_CREDENTIAL: dev-service-credential-mobile
      TLS_KEYSTORE_PATH: file:/certs/keystore.p12
      TLS_KEYSTORE_PASSWORD: xyzbank-dev
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-check-certificate -qO- https://127.0.0.1:8082/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  bff-atm:
    build:
      context: .
      dockerfile: bff/bff-atm/Dockerfile
    container_name: xyz-bank-bff-atm
    ports:
      - "8083:8083"
    volumes:
      - ./dev/certs/bff-atm/keystore.p12:/certs/keystore.p12:ro
      - ./dev/certs/truststore.p12:/certs/truststore.p12:ro
      - ./dev/certs/atm-terminal/keystore.p12:/certs/terminal-keystore.p12:ro
    depends_on:
      core-service:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_CLIENT_ENABLED: "true"
      EUREKA_SERVER_URL: http://eureka-server:8761
      CORE_SERVICE_BASE_URL: http://core-service
      CORE_SERVICE_PIN_VERIFICATION_BASE_URL: https://core-service:8453
      CORE_SERVICE_CREDENTIAL: dev-service-credential-atm
      TLS_KEYSTORE_PATH: file:/certs/keystore.p12
      TLS_KEYSTORE_PASSWORD: xyzbank-dev
      TLS_TRUSTSTORE_PATH: file:/certs/truststore.p12
      TLS_TRUSTSTORE_PASSWORD: xyzbank-dev
    healthcheck:
      # bff-atm's connector requires a client certificate (client-auth: need), so even
      # the health check must present one: it uses the same dev terminal certificate a
      # real ATM terminal would, via curl (busybox wget cannot present a client cert)
      test: ["CMD", "sh", "-c", "curl -sk --cert-type P12 --cert /certs/terminal-keystore.p12:xyzbank-dev https://127.0.0.1:8083/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  gateway:
    build:
      context: .
      dockerfile: platform/gateway/Dockerfile
    container_name: xyz-bank-gateway
    ports:
      - "8090:8090"
    volumes:
      - ./dev/certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      bff-web:
        condition: service_healthy
      bff-mobile:
        condition: service_healthy
      bff-atm:
        condition: service_healthy
    environment:
      BFF_WEB_BASE_URL: https://bff-web:8081
      BFF_MOBILE_BASE_URL: https://bff-mobile:8082
      BFF_ATM_BASE_URL: https://bff-atm:8083
      TLS_TRUSTED_CA_PATH: file:/certs/ca.crt
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://127.0.0.1:8090/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  xyz_bank_mysql_data:
  xyz_bank_postgres_data:
