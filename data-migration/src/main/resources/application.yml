spring:
  application:
    name: xyz-bank-data-migration
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:xyz_bank_migration}
    username: ${DB_USERNAME:migration}
    password: ${DB_PASSWORD:migration}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false

migration:
  run-all: ${MIGRATION_RUN_ALL:false}
  data:
    daily-transactions: ${MIGRATION_DAILY_TRANSACTIONS:file:data/legacy/movimientos_financieros_diarios.csv}
    monthly-interests: ${MIGRATION_MONTHLY_INTERESTS:file:data/legacy/intereses_trimestrales.csv}
    annual-accounts: ${MIGRATION_ANNUAL_ACCOUNTS:file:data/legacy/estados_financieros_anuales.csv}
  batch:
    chunk-size: 5
    throttle-limit: 3
    skip-limit: 2000
    retry-limit: 3

logging:
  level:
    root: INFO
    com.xyzbank.migration: INFO
    org.springframework.batch: INFO
